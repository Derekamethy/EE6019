name: Release QA

on:
  push:
    branches: [main, portfolio-rebuild-2026-09]
  pull_request:

permissions:
  contents: read

jobs:
  structural-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run dependency-light release checks
        run: python scripts/check_release.py
