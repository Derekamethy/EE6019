[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ee6019-eeg-seizure-detection"
version = "0.1.0"
description = "Patient-specific EEG seizure detection and clinical error analysis portfolio project"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Yangdeyi Yang"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
